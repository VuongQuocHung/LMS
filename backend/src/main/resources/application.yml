spring:
  config:
    # Đọc .env cạnh pom.xml bằng bộ đọc Properties có sẵn của Spring Boot.
    # Chạy lệnh từ thư mục backend; không cần cài thêm thư viện dotenv.
    import: "optional:file:./.env[.properties]"
  application:
    name: lms-backend
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_BYTES:20971520}B
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:21MB}
  datasource:
    # Giá trị thật nằm trong backend/.env hoặc biến môi trường cùng tên.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

app:
  files:
    directory: ${UPLOAD_DIR:./uploads}
    max-bytes: ${UPLOAD_MAX_BYTES:20971520}
    max-count: ${UPLOAD_MAX_COUNT:5}
  seed:
    # Không tự tạo tài khoản demo ngoài profile dev/test.
    enabled: false
